<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Deluve — Technology Startup Studio & IT Consulting in Mozambique</title>
    <meta name="description" content="Deluve is a leading technology startup studio in Maputo, Mozambique. We specialize in software development, IT consulting, process automation, and data analytics for startups and enterprises." />
    <meta name="keywords" content="technology startup studio, IT consulting, software development, process automation, data analytics, digital transformation, Mozambique, Maputo" />
    <meta name="author" content="Deluve" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://deluve.io" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deluve.io" />
    <meta property="og:title" content="Deluve — Technology Startup Studio & IT Consulting" />
    <meta property="og:description" content="Build the future with us. We create, develop, and accelerate innovative startups through cutting-edge technology and strategic consulting." />
    <meta property="og:image" content="https://deluve.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Deluve" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://deluve.io" />
    <meta name="twitter:title" content="Deluve — Startup Studio & IT Consulting" />
    <meta name="twitter:description" content="Building innovative products and transforming businesses through technology." />
    <meta name="twitter:image" content="https://deluve.io/og-image.png" />
    <meta name="twitter:creator" content="@deluveio" />
    
    <!-- Additional SEO -->
    <meta name="geo.placename" content="Maputo" />
    <meta name="geo.region" content="MZ" />
    <meta name="ICBM" content="-23.8635, 35.3394" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Preconnect to optimize performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Deluve",
      "alternateName": "Deluve Technology Startup Studio",
      "url": "https://deluve.io",
      "logo": "https://deluve.io/logo.png",
      "description": "Technology Startup Studio & IT Consulting based in Maputo, Mozambique",
      "sameAs": [
        "https://linkedin.com/company/deluve",
        "https://github.com/deluve",
        "https://twitter.com/deluveio"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Maputo",
        "addressLocality": "Maputo",
        "addressCountry": "MZ"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Business",
        "telephone": "+258-84-000-0000",
        "email": "info@deluve.com"
      }
    }
    </script>

    <!-- Sitemap and RSS -->
    <link rel="sitemap" type="application/xml" href="https://deluve.io/sitemap.xml" />

  <body>
    <div id="root"></div>
